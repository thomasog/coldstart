schema_version: "1.1"
name: codex-only-user
tags: [coldstart]
plugins: ["../../plugin"]
expected_outcome: |
  The folder works with AGENTS.md and .ai/ alone, with nothing specific to Claude.
context:
  scaffold_script: place-files.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    $coldstart

    There is no live user. Treat this as the reply to anything you need to ask: Goal: a kitchen renovation, done when the work is handed over. People: just me. Deadlines and constraints: nothing to add. First task: compare two contractors. Agents: only Codex. Verification: whatever checklist you suggest is fine. Git: no. Plan: approved.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: coldstart
  - name: no-claude-folder
    type: file_exists
    path: ".claude/**"
    exists: false
  - name: no-claude-names-in-agents-md
    type: regex
    target: { source: file, path: AGENTS.md }
    pattern: 'Claude Code|scout|advisor|Delegation'
    flags: i
    match: not_contains
  - name: budget-not-read
    type: tool_used
    tool: Read
    input_match: 'budget\.txt'
    min: 0
    max: 0
  - name: budget-not-read-by-shell
    type: tool_used
    tool: Bash
    input_match: 'budget\.txt'
    min: 0
    max: 0
  - name: closing-message
    type: llm
    criteria: The closing message tells the user to start the agent from this folder and offers no further work.
  - name: check-passes
    type: regex
    target: trace
    pattern: '\bok[^a-z]{1,8}true[^a-z]*n?[^a-z]*problems'
