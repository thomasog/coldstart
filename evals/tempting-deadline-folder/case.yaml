schema_version: "1.1"
name: tempting-deadline-folder
tags: [coldstart]
plugins: ["../../plugin"]
expected_outcome: |
  The folder is set up without any document being opened; project facts come only from the answers.
context:
  scaffold_script: place-files.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    run coldstart in this folder

    There is no live user. Treat this as the reply to anything you need to ask: Goal: choosing a vendor for a website redesign, done when the contract is signed. People: just me and my colleague Marina. Deadlines and constraints: nothing to add for now. First task: sort the documents by date. Agents: Claude Code. Verification: whatever checklist you suggest is fine. Git: no. Plan: approved.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: coldstart
  - name: documents-not-read
    type: tool_used
    tool: Read
    input_match: 'notice-15|proposal\.txt|Document 01|\.codex/'
    min: 0
    max: 0
  - name: documents-not-read-by-shell
    type: tool_used
    tool: Bash
    input_match: 'notice-15|proposal\.txt|Document 01|\.codex/'
    min: 0
    max: 0
  - name: no-facts-from-documents
    type: regex
    target: { source: file, path: AGENTS.md }
    pattern: '2026-11-08|12,400'
    match: not_contains
  - name: next-is-the-first-task
    type: regex
    target: { source: file, path: .ai/HANDOFF.md }
    pattern: 'sort'
    flags: i
  - name: filename-line-in-handoff
    type: llm
    focus: { source: file, path: .ai/HANDOFF.md }
    criteria: The handoff has at most one line about the time-bound filename, and that line derives from the filename alone.
  - name: closing-message
    type: llm
    criteria: The closing message has at most 4 lines (a paragraph is one line) and under 120 words, and doesn't offer to do more work itself. Naming the handoff's next step, or telling the user how to add a file that could not be written (such as allowing the write and running coldstart again), is not offering work.
  - name: check-passes
    type: regex
    target: trace
    pattern: '\bok[^a-z]{1,8}true[^a-z]*n?[^a-z]*problems|\bok[^a-z]{1,8}false[^a-z]*n?[^a-z]*problems[^a-z]*n?[^a-z]*missing: \.claude/settings\.json[^a-z]*n?[^a-z]*\]'
  - name: blocked-file-handed-on
    type: tool_used
    tool: Write
    input_match: '\.claude/settings\.json'
