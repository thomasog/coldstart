schema_version: "1.1"
name: routing-accepted
tags: [coldstart]
plugins: ["../../plugin"]
expected_outcome: |
  A yes to routing keeps the Delegation section in AGENTS.md and writes no agent file or advisor setting.
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    /coldstart

    There is no live user. Treat this as the reply to anything you need to ask: Goal: organizing my tax paperwork for the year, done when the return is filed. People: just me. Deadlines and constraints: nothing to add. First task: list the documents I still need. Agents: Claude Code. Routing: yes. Verification: totals re-added by hand. Git: no. Plan: approved.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: coldstart
  - name: delegation-section-kept
    type: regex
    target: { source: file, path: AGENTS.md }
    pattern: 'lowest model tier that gets it right'
  - name: tiers-stay-relative
    type: regex
    target: { source: file, path: AGENTS.md }
    pattern: 'Haiku|Sonnet|Opus|Fable'
    flags: i
    match: not_contains
  - name: no-agent-files
    type: file_exists
    path: ".claude/agents/**"
    exists: false
  - name: no-advisor-setting
    type: regex
    target: { source: file, path: .claude/settings.json }
    pattern: 'advisorModel'
    match: not_contains
  - name: closing-message
    type: llm
    criteria: The closing message offers no further work on the project and does not claim that an advisor was turned on.
  - name: check-passes
    type: regex
    target: trace
    pattern: '\bok[^a-z]{1,8}true[^a-z]*n?[^a-z]*problems'
