schema_version: "1.1"
name: does-not-self-trigger
tags: [coldstart]
plugins: ["../../plugin"]
expected_outcome: |
  A request that doesn't name the skill doesn't start it.
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: this folder is a mess, clean it up and write me an AGENTS.md
graders:
  - name: skill-not-started
    type: tool_used
    tool: Skill
    input_match: coldstart
    min: 0
    max: 0
