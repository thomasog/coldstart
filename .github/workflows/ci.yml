name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No personal paths
        run: "! git grep -nE '[A-Za-z]:.Users.[a-z]' -- plugin evals README.md"
      - name: One human author
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT: origin/${{ github.event.repository.default_branch }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=$DEFAULT
          ! git log --format=%B "$BASE..HEAD" | grep -qi 'co-authored-by'
